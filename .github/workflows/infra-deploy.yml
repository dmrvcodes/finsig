name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-finsig-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.changes.outputs.render }}
      aws: ${{ steps.changes.outputs.aws }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Verify main commit and classify deployment changes
        id: changes
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_SHA" ]]
          if [[ "$(git rev-parse origin/main)" != "$VERIFIED_SHA" ]]; then
            echo 'A newer main commit exists; its CI run will deploy it.'
            exit 0
          fi

          if ! git diff --quiet HEAD^ HEAD -- \
            apps/web packages package.json pnpm-lock.yaml pnpm-workspace.yaml \
            turbo.json render.yaml scripts/ci/deploy-render.mjs \
            .github/workflows/ci.yml .github/workflows/infra-deploy.yml; then
            echo 'render=true' >> "$GITHUB_OUTPUT"
          fi

          if ! git diff --quiet HEAD^ HEAD -- \
            infra .github/actions/detect-changes/action.yml \
            .github/workflows/ci.yml .github/workflows/infra-deploy.yml; then
            echo 'aws=true' >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Deploy verified commit and smoke test
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/deploy-render.mjs

  aws-terraform:
    needs: changes
    if: needs.changes.outputs.aws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_app_base_url: https://finsig-demo.onrender.com
      TF_VAR_monthly_budget_usd: '100'
      TF_VAR_budget_alert_email: ${{ secrets.AWS_BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log OIDC claim shape for trust-policy repair
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience=sts.amazonaws.com",
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          keys = ("aud", "sub", "repository", "repository_id", "ref", "event_name", "workflow_ref", "job_workflow_ref")
          print(json.dumps({key: claims.get(key) for key in keys}, sort_keys=True))
          PY
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.2.1
        with:
          role-to-assume: arn:aws:iam::623588627433:role/finsig/FinSig_admin
          role-session-name: finsig-main-infra-deploy
          aws-region: eu-central-1
      - name: Validate AWS identity and budget alert configuration
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account_id" == '623588627433' ]] || {
            echo 'Refusing to deploy outside the FinSig AWS account.' >&2
            exit 1
          }

          if [[ ! "${TF_VAR_budget_alert_email:-}" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]; then
            echo 'Set the AWS_BUDGET_ALERT_EMAIL GitHub Actions secret before merging infrastructure changes.' >&2
            exit 1
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.5
      - name: Initialize remote state
        run: |
          terraform -chdir=infra/envs/dev init -input=false \
            -backend-config='bucket=finsig-tfstate-623588627433-eu-central-1' \
            -backend-config='key=envs/dev/terraform.tfstate' \
            -backend-config='region=eu-central-1' \
            -backend-config='use_lockfile=true' \
            -backend-config='encrypt=true' \
            -backend-config='allowed_account_ids=["623588627433"]'
      - name: Plan AWS stack
        run: terraform -chdir=infra/envs/dev plan -no-color -out=dev.tfplan
      - name: Apply reviewed plan
        run: terraform -chdir=infra/envs/dev apply -no-color -auto-approve dev.tfplan
      - name: Report deployed stack outputs
        run: |
          terraform -chdir=infra/envs/dev output -json | \
            jq '{account_id: .account_id.value, app_instance_id: .app_instance_id.value, app_public_ip: .app_public_ip.value, uploads_bucket: .uploads_bucket.value}'
