services:
  - type: web
    name: finsig-demo
    runtime: node
    plan: starter # 0.5 CPU, 512 MB; listed as 0.5c-512mb by the Render API
    region: frankfurt
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm --filter @finsig/web build
    startCommand: corepack pnpm --filter @finsig/web exec next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /demo
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      - key: PAYPAL_SANDBOX_CLIENT_ID
        sync: false
      - key: PAYPAL_SANDBOX_CLIENT_SECRET
        sync: false
      - key: PAYPAL_LOGIN_ENABLED
        value: 'false'
      - key: APP_BASE_URL
        value: https://finsig-demo.onrender.com
      - key: SESSION_SECRET
        generateValue: true
